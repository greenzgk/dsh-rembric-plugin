name: CI

on:
  push:
  pull_request:

jobs:
  check-and-test:
    name: vp check + vp test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed before setup-node so that setup-node's
      # `cache: pnpm` can locate the pnpm store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm exec vp check --deny-warnings

      - name: Lint hygiene (unused disable directives)
        run: pnpm exec vp lint --report-unused-disable-directives

      - name: Test
        run: pnpm exec vp test
